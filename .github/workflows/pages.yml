---
name: "Pages: Landing"

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - CONTRIBUTING.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment that is running is never cut short by a newer push: the newer one waits its turn. Cancelling it midway is what left
# the next run looking for an artifact that was no longer there.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # Only what the page needs goes online: the inputs of the build (source/) and the notes for contributors stay in the repository
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The docs pages are made from the same markdown files GitHub shows, so they are rebuilt here and never fall behind
      - run: node scripts/build-docs.mjs
      - name: Collect what is published
        run: |
          mkdir -p _site
          rsync -a --exclude source --exclude README.md site/ _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # The upload finishes, and the list of artifacts that deploy-pages reads can still be empty for a few seconds: it then fails
      # with "Found 0 artifact(s)" although the artifact exists. A short wait makes that rare, and the deploy below tries twice.
      - name: Let the artifact list catch up
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Try the deployment once more
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
